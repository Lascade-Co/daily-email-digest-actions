name: Daily Revenue Digest

on:
  schedule:
    - cron: '30 0 * * *'     # 6:00 AM IST → angelrose@lascade.com
    - cron: '0 14 * * *'     # 6:00 AM PST → cherian@lascade.com
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the email without sending
        type: boolean
        default: false
      to:
        description: "Test: send [TEST] email to this address only"
        type: string
        default: ""
      slot:
        description: "Which timezone slot (ignored when 'to' is set)"
        type: choice
        options: [both, IST, PST]
        default: both

permissions:
  contents: read

concurrency:
  group: revenue-${{ github.event.schedule || inputs.slot || 'manual' }}
  cancel-in-progress: false

env:
  RAW: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      run_ist: ${{ steps.s.outputs.run_ist }}
      run_pst: ${{ steps.s.outputs.run_pst }}
      report_date: ${{ steps.s.outputs.report_date }}
    steps:
      - id: s
        run: |
          echo "report_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "30 0 * * *")  echo "run_ist=true"  >> "$GITHUB_OUTPUT"; echo "run_pst=false" >> "$GITHUB_OUTPUT" ;;
              "0 14 * * *")  echo "run_ist=false" >> "$GITHUB_OUTPUT"; echo "run_pst=true"  >> "$GITHUB_OUTPUT" ;;
            esac
          else
            TO="${{ inputs.to }}"
            SLOT="${{ inputs.slot }}"
            if [ -n "$TO" ]; then
              echo "run_ist=true"  >> "$GITHUB_OUTPUT"
              echo "run_pst=false" >> "$GITHUB_OUTPUT"
            elif [ "$SLOT" = "IST" ]; then
              echo "run_ist=true"  >> "$GITHUB_OUTPUT"
              echo "run_pst=false" >> "$GITHUB_OUTPUT"
            elif [ "$SLOT" = "PST" ]; then
              echo "run_ist=false" >> "$GITHUB_OUTPUT"
              echo "run_pst=true"  >> "$GITHUB_OUTPUT"
            else
              echo "run_ist=true"  >> "$GITHUB_OUTPUT"
              echo "run_pst=true"  >> "$GITHUB_OUTPUT"
            fi
          fi

  email-ist:
    needs: resolve
    if: needs.resolve.outputs.run_ist == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --quiet requests==2.34.2

      - name: Download scripts
        run: |
          for m in revenue_fetch revenue_model revenue_render revenue_main; do
            curl -fsSL --retry 3 --retry-delay 2 -o "$m.py" "$RAW/scripts/revenue/$m.py"
          done

      - name: Send revenue digest (IST)
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 revenue_main.py \
            --report-date "${{ needs.resolve.outputs.report_date }}" \
            --recipients "angelrose@lascade.com" \
            --tz Asia/Kolkata \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.to && format('--to "{0}"', inputs.to) || '' }}

  email-pst:
    needs: resolve
    if: needs.resolve.outputs.run_pst == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install --quiet requests==2.34.2

      - name: Download scripts
        run: |
          for m in revenue_fetch revenue_model revenue_render revenue_main; do
            curl -fsSL --retry 3 --retry-delay 2 -o "$m.py" "$RAW/scripts/revenue/$m.py"
          done

      - name: Send revenue digest (PST)
        env:
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python3 revenue_main.py \
            --report-date "${{ needs.resolve.outputs.report_date }}" \
            --recipients "cherian@lascade.com" \
            --tz America/Los_Angeles \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.to && format('--to "{0}"', inputs.to) || '' }}
